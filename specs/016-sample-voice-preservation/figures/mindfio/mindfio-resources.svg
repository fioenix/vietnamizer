			<text x="30" y="71" style="font-family: MindfioUnicode; font-size: 10px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,142) scale(1,-1)">Model backend chưa được runtime chứng thực; raw usage được giữ nguyên. Quota thuê bao không quy đổi thành hóa đơn USD.</text>
